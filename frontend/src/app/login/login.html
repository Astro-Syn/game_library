
<div class="login-container">

  <button
    type="button"
    class="nav-button"
    (click)="showLogin = !showLogin"
  >
    {{ showLogin ? 'CANCEL' : 'LOGIN' }}
  </button>

  <div *ngIf="showLogin" class="login-form-container">

    <h2>Welcome Back</h2>
    <p class="login-subtitle">Sign in to access your game library.</p>

    <form (ngSubmit)="login()">

      <label for="username">Username</label>
      <input
        id="username"
        type="text"
        name="username"
        placeholder="Enter your username"
        [(ngModel)]="username"
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        placeholder="Enter your password"
        [(ngModel)]="password"
      >

      <p *ngIf="loginError" class="login-error">
        {{ loginError }}
      </p>

      <button type="submit" class="nav-button login-submit">
        LOGIN
      </button>

    </form>

    <div class="guest-divider"><span>or</span></div>

    <button
      type="button"
      class="nav-button guest-button"
      (click)="loginAsGuest()"
    >
      CONTINUE AS GUEST
    </button>

    <p class="guest-hint">
      No account needed. Your library is kept until you close this tab.
    </p>

  </div>

</div>
