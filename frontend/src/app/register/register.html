
<div class="register-container">

  <div class="register-form-container">

    <h2>Create Account</h2>
    <p class="register-subtitle">
      Join the library and start tracking your games.
    </p>

    <form (ngSubmit)="register()">

      <label for="username">Username</label>
      <input
        id="username"
        type="text"
        name="username"
        placeholder="Choose a username"
        [(ngModel)]="username"
        required
      >

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        placeholder="Enter your email"
        [(ngModel)]="email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        placeholder="Choose a password"
        [(ngModel)]="password"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        id="confirmPassword"
        type="password"
        name="confirmPassword"
        placeholder="Confirm your password"
        [(ngModel)]="confirmPassword"
        required
      >

      <p *ngIf="registerError" class="register-error">
        {{ registerError }}
      </p>

      <p *ngIf="successMessage" class="register-success">
        {{ successMessage }}
      </p>

      <button type="submit" class="nav-button register-submit">
        CREATE ACCOUNT
      </button>

    </form>

  </div>

</div>
